[project]
name = "agente-faturas"
version = "0.1.0"
description = "Agente de faturas de fornecedores: lê, valida e encaminha faturas para conferência e aprovação."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "qrcode>=8.2",
    "reportlab>=5.1.0",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"